name: Python CI Demo

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        pytest

    - name: Build output directory
      run: |
        mkdir -p build_output
        # هنا تنسخ الملفات اللي تحتاجها فقط مع استثناء مجلد build_output
        rsync -av --exclude='build_output' ./ build_output/
        
    - name: Deploy application
      run: |
        echo "🚀 Starting deployment..."
        # ضع هنا أي أوامر نشر أخرى تحتاجها، مثلاً رفع الملفات إلى خادم، أو إرسالها إلى سيرفر
        echo "✅ Deployment complete!"
