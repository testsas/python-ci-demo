name: Python CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🧪 Run tests
        run: |
          pytest || echo "⚠️ No tests found, skipping test step."

      - name: 🏗️ Build project output
        run: |
          echo "📁 Creating build_output folder..."
          mkdir -p build_output
          echo "📂 Copying project files (excluding build_output)..."
          rsync -av --exclude='build_output' ./ build_output/

      - name: 🚀 Deploy application
        run: |
          echo "🚀 Starting deployment..."
          # هنا تضع أوامر النشر الخاصة بك
          echo "✅ Deployment completed successfully!"
